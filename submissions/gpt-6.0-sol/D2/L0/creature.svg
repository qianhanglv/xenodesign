    <!-- Hull and hinged exoskeleton -->
    <path d="M79 259 Q84 195 144 174 Q242 140 361 175 Q420 190 432 246 Q435 308 380 333 Q258 367 143 331 Q88 313 79 259Z" fill="#183748" stroke="#76b8ad" stroke-width="5"/>
    <path d="M94 253 Q119 189 226 181 Q349 164 412 220 M93 278 Q165 338 302 337 Q390 332 421 286" stroke="#3c7580" stroke-width="4"/>

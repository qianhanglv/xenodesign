      <ellipse cx="133" cy="296" rx="12" ry="7"/>
    </g>
    <!-- Two antennae -->
    <g stroke="#86dcc5" stroke-width="6">
      <path d="M111 184 Q91 137 74 114"/><path d="M145 175 Q142 128 130 104"/>
    </g>
    <g fill="#aaf7cf"><circle cx="74" cy="114" r="6"/><circle cx="130" cy="104" r="6"/></g>
    <!-- Near-side limbs -->
    <g stroke="#71a59c" stroke-width="20">
      <path d="M168 307 154 367 124 419"/>
      <path d="M251 324 242 378 222 430"/>
      <path d="M337 314 333 377 315 420"/>

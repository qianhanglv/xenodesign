    <g fill="#537e83" stroke="#a4d4b6" stroke-width="3">
      <path d="M113 190 136 163 159 165 165 190 139 205Z"/>
      <path d="M163 171 187 150 211 154 213 183 184 194Z"/>
      <path d="M214 155 239 144 261 149 263 178 234 184Z"/>
      <path d="M265 148 292 149 313 160 310 187 277 181Z"/>
      <path d="M315 157 340 163 360 180 351 204 320 190Z"/>
      <path d="M362 176 389 187 408 212 391 229 359 207Z"/>
    </g>
    <!-- Paired posterior spore sacs -->
    <ellipse cx="391" cy="258" rx="20" ry="25" fill="#38666d" stroke="#80d7a7" stroke-width="3"/>
    <ellipse cx="363" cy="272" rx="25" ry="29" fill="#4c7b78" stroke="#a2e1ae" stroke-width="3"/>
    <circle cx="391" cy="258" r="5" fill="#9df3bd"/>
    <circle cx="363" cy="272" r="6" fill="#9df3bd"/>

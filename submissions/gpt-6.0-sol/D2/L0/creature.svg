    <g fill="#9df4e5" stroke="#083a4a" stroke-width="4">
      <circle cx="108" cy="212" r="8"/><circle cx="139" cy="201" r="8"/>
      <circle cx="115" cy="235" r="10"/><circle cx="147" cy="224" r="10"/>
    </g>
    <!-- Two feeding openings -->
    <g fill="#071f30" stroke="#82d9ce" stroke-width="4">

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" role="img" aria-label="Original cryo-creature study">
<defs>
  <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e1f5f4"/><stop offset="0.42" stop-color="#7ba8b8"/><stop offset="1" stop-color="#29465f"/></linearGradient>
  <linearGradient id="shellDark" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#a9d7da"/><stop offset="0.55" stop-color="#4f788d"/><stop offset="1" stop-color="#20374f"/></linearGradient>
  <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0ffff"/><stop offset="0.5" stop-color="#7bd4d5"/><stop offset="1" stop-color="#367e91"/></linearGradient>
  <linearGradient id="sac" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#bafff3" stop-opacity="0.9"/><stop offset="0.4" stop-color="#41c8cb" stop-opacity="0.82"/><stop offset="1" stop-color="#176b91" stop-opacity="0.92"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#b6fff0" stop-opacity="0.75"/><stop offset="1" stop-color="#4ad3d5" stop-opacity="0"/></radialGradient>
  <linearGradient id="bone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1c8"/><stop offset="1" stop-color="#b7c8ca"/></linearGradient>
  <pattern id="icegrain" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M2 18 L8 8 L13 13 L19 3" fill="none" stroke="#d7f7f2" stroke-width="1.5" opacity=".28"/><circle cx="18" cy="19" r="1.5" fill="#d7f7f2" opacity=".34"/></pattern>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
.outline{stroke:#18374d;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
.fine{stroke:#23465d;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;fill:none}
.glint{stroke:#e7ffff;stroke-width:3;stroke-linecap:round;fill:none;opacity:.82}
.plate{fill:url(#shell);stroke:#18374d;stroke-width:4;stroke-linejoin:round}
.limb{fill:none;stroke:#507f91;stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
.limb-hi{fill:none;stroke:#c4eeee;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.joint{fill:url(#crystal);stroke:#18374d;stroke-width:3}
.pad{fill:#294f63;stroke:#102e45;stroke-width:3}
.sac{fill:url(#sac);stroke:#c0fff3;stroke-width:3}
</style>

<g id="single-unfolded-pelt">
<!-- One connected outline: frontal lobe, neck bridge, dorsal panel, paired lateral sheets, ventral flap and tail extension. -->
<path d="M190 86 C211 55 301 55 322 86 L344 120 L334 151 L303 171 L294 198 L365 212 L435 242 L430 315 L360 347 L302 344 L285 389 L300 435 L256 464 L212 435 L227 389 L210 344 L152 347 L82 315 L77 242 L147 212 L218 198 L209 171 L178 151 L168 120 Z" fill="url(#shell)" stroke="#17394f" stroke-width="6" stroke-linejoin="round"/>
<!-- dorsal core and left/right panels -->
<path d="M190 190 Q256 165 322 190 L342 319 Q302 351 256 357 Q210 351 170 319 Z" fill="#557e91" stroke="#244a60" stroke-width="3"/>
<path d="M174 211 L94 246 L98 304 L158 329 L188 300 Z" fill="#9fc9c8" stroke="#365d72" stroke-width="3"/>
<path d="M338 211 L418 246 L414 304 L354 329 L324 300 Z" fill="#9fc9c8" stroke="#365d72" stroke-width="3"/>
<!-- ventral flap attached continuously at the posterior hinge -->
<path d="M225 348 Q256 366 287 348 L291 389 L256 450 L221 389 Z" fill="#315b72" stroke="#b9e8e3" stroke-width="3"/>
<!-- Head lobe with continuous neck -->
<path d="M190 86 C211 55 301 55 322 86 L334 120 Q321 160 294 177 L285 205 Q256 218 227 205 L218 177 Q191 160 178 120 Z" fill="#c0e4df" stroke="#31586d" stroke-width="3"/>
<path d="M218 178 Q256 199 294 178 L286 218 Q256 235 226 218 Z" fill="#6695a3" stroke="#31586d" stroke-width="3"/>
<!-- facial and antenna apertures -->
<ellipse cx="220" cy="125" rx="9" ry="13" fill="#102e45" stroke="#d8ffff" stroke-width="3"/><ellipse cx="292" cy="125" rx="9" ry="13" fill="#102e45" stroke="#d8ffff" stroke-width="3"/>
<path d="M246 151 Q256 157 266 151" fill="none" stroke="#17394f" stroke-width="8" stroke-linecap="round"/>
<circle cx="205" cy="87" r="8" fill="#183b52" stroke="#dcffff" stroke-width="3"/><circle cx="307" cy="87" r="8" fill="#183b52" stroke="#dcffff" stroke-width="3"/>
<!-- four limb-socket holes, two per lateral side -->
<ellipse cx="153" cy="237" rx="12" ry="16" fill="#17394f" stroke="#d6f7f0" stroke-width="3"/><ellipse cx="160" cy="313" rx="12" ry="16" fill="#17394f" stroke="#d6f7f0" stroke-width="3"/>
<ellipse cx="359" cy="237" rx="12" ry="16" fill="#17394f" stroke="#d6f7f0" stroke-width="3"/><ellipse cx="352" cy="313" rx="12" ry="16" fill="#17394f" stroke="#d6f7f0" stroke-width="3"/>
<!-- tail extension and its single basal boundary -->
<path d="M256 447 Q238 462 256 492 Q274 462 256 447 Z" fill="#345c73" stroke="#18394f" stroke-width="4"/>
<path d="M235 448 Q256 460 277 448" fill="none" stroke="#e3ffff" stroke-width="4"/>
<!-- seam/incision lines; their ends stay inside the connected outline -->
<g fill="none" stroke="#dffaf4" stroke-width="3" stroke-dasharray="8 6" opacity=".95"><path d="M190 190 Q166 214 174 264 Q180 305 210 344"/><path d="M322 190 Q346 214 338 264 Q332 305 302 344"/><path d="M210 344 Q256 366 302 344"/><path d="M218 177 Q256 191 294 177"/><path d="M227 218 Q256 233 285 218"/></g>
<!-- continuous frost striae carry across the seams -->
<g fill="none" stroke="#edffff" stroke-width="3" opacity=".6"><path d="M125 270 Q156 260 185 274 Q216 287 235 281"/><path d="M277 281 Q306 287 327 274 Q356 260 387 270"/><path d="M226 96 Q256 108 286 96"/><path d="M240 397 Q256 410 272 397"/></g>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

<defs>
  <linearGradient id="shell" x1="0" y1="0" x2="0.9" y2="1">
    <stop offset="0" stop-color="#e2f2e8"/>
    <stop offset="0.42" stop-color="#91b8ae"/>
    <stop offset="1" stop-color="#365f69"/>
  </linearGradient>
  <linearGradient id="shellDark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8cb8b2"/>
    <stop offset="1" stop-color="#294a58"/>
  </linearGradient>
  <linearGradient id="plate" x1="0" y1="0" x2="0.8" y2="1">
    <stop offset="0" stop-color="#f0f1d9"/>
    <stop offset="0.48" stop-color="#9dbdb0"/>
    <stop offset="1" stop-color="#456a70"/>
  </linearGradient>
  <linearGradient id="ventral" x1="0" y1="0" x2="0.8" y2="1">
    <stop offset="0" stop-color="#6b9391"/>
    <stop offset="1" stop-color="#233c4a"/>
  </linearGradient>
  <linearGradient id="limb" x1="0" y1="0" x2="0.8" y2="1">
    <stop offset="0" stop-color="#b9d3c4"/>
    <stop offset="1" stop-color="#436d72"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#e0ffff"/>
    <stop offset="0.35" stop-color="#6dfff0"/>
    <stop offset="1" stop-color="#16aeb5" stop-opacity="0.18"/>
  </radialGradient>
  <linearGradient id="sac" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffe8a0"/>
    <stop offset="0.5" stop-color="#c98954"/>
    <stop offset="1" stop-color="#6f4550"/>
  </linearGradient>
  <radialGradient id="cavity">
    <stop offset="0" stop-color="#b9d3a7"/>
    <stop offset="0.7" stop-color="#648d83"/>
    <stop offset="1" stop-color="#294b59"/>
  </radialGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#071b2b"/>
    <stop offset="1" stop-color="#163846"/>
  </linearGradient>
  <pattern id="micro" width="18" height="18" patternUnits="userSpaceOnUse">
    <path d="M2 9 L9 2 L16 9 L9 16 Z" fill="none" stroke="#d5eee0" stroke-opacity=".10" stroke-width="1"/>
  </pattern>
  <pattern id="ventralPattern" width="22" height="18" patternUnits="userSpaceOnUse">
    <path d="M0 9 L11 1 L22 9 L11 17 Z" fill="none" stroke="#c3e2d4" stroke-opacity=".24" stroke-width="1"/>
  </pattern>
</defs>
<style>
  .outline{stroke:#142f3d;stroke-width:7;stroke-linejoin:round;stroke-linecap:round}
  .seam{fill:none;stroke:#234652;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .fine{fill:none;stroke:#d5e8d9;stroke-opacity:.62;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .glint{fill:none;stroke:#69fff0;stroke-width:4;stroke-linecap:round;filter:none}
  .limbStroke{fill:none;stroke:#163744;stroke-width:26;stroke-linecap:round;stroke-linejoin:round}
  .limbCore{fill:none;stroke:url(#limb);stroke-width:18;stroke-linecap:round;stroke-linejoin:round}
  .joint{fill:#bdd6c4;stroke:#214653;stroke-width:5}
  .port{fill:#071e2a;stroke:#69bcb2;stroke-width:5}
  .eye{fill:#071d2a;stroke:#b6e6d2;stroke-width:4}
  .eyeCore{fill:#73fff0;stroke:#e2ffff;stroke-width:1.8}
  .plate{fill:url(#plate);stroke:#1a3a48;stroke-width:5;stroke-linejoin:round}
  .sac{fill:url(#sac);stroke:#472f3b;stroke-width:5}
  .antenna{fill:none;stroke:#a6cdbd;stroke-width:9;stroke-linecap:round}
  .antennaCore{fill:none;stroke:#edffed;stroke-width:2.5;stroke-linecap:round}
</style>
<rect width="512" height="512" fill="url(#bg)"/>


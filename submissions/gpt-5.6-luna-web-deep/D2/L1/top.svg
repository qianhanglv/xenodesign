      <path d="M431 362 Q444 353 457 365 Q452 377 435 375 Z" fill="#6e9994" stroke="#163744" stroke-width="4"/>
      <path d="M440 367 L451 368" class="glint"/>
    </g>
<!-- continuous head, neck and torso silhouette -->
<path d="M256 62 C215 63 183 94 177 137 C164 159 151 198 153 257 C154 336 180 405 256 451 C332 405 358 336 359 257 C361 198 348 159 335 137 C329 94 297 63 256 62 Z" fill="url(#shell)" class="outline"/>
<path d="M256 82 C221 88 201 116 201 150 C193 176 186 216 188 267 C191 335 214 387 256 417 C298 387 321 335 324 267 C326 216 319 176 311 150 C311 116 291 88 256 82 Z" fill="url(#micro)" opacity=".48"/>
<!-- four eyes: two on each lateral cheek, all on the head lobe -->
<g>
 <ellipse cx="222" cy="110" rx="12" ry="10" class="eye"/><ellipse cx="222" cy="110" rx="4.5" ry="4.5" class="eyeCore"/>
 <ellipse cx="290" cy="110" rx="12" ry="10" class="eye"/><ellipse cx="290" cy="110" rx="4.5" ry="4.5" class="eyeCore"/>
 <ellipse cx="211" cy="139" rx="12" ry="10" class="eye"/><ellipse cx="211" cy="139" rx="4.5" ry="4.5" class="eyeCore"/>
 <ellipse cx="301" cy="139" rx="12" ry="10" class="eye"/><ellipse cx="301" cy="139" rx="4.5" ry="4.5" class="eyeCore"/>
</g>
<!-- two lateral filter-feeding openings -->
<ellipse cx="190" cy="168" rx="13" ry="7" transform="rotate(-35 190 168)" class="port"/>
<ellipse cx="322" cy="168" rx="13" ry="7" transform="rotate(35 322 168)" class="port"/>

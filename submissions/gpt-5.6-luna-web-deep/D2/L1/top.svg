      <path d="M64 293 L75 294" class="glint"/>
    </g><g>
      <path d="M337 286 L401 272 L444 293" class="limbStroke"/>
      <path d="M337 286 L401 272 L444 293" class="limbCore"/>
      <circle cx="337" cy="286" r="11" class="joint"/><circle cx="401" cy="272" r="10" class="joint"/>
      <path d="M431 288 Q444 279 457 291 Q452 303 435 301 Z" fill="#6e9994" stroke="#163744" stroke-width="4"/>
      <path d="M440 293 L451 294" class="glint"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

<defs>
  <linearGradient id="shell" x1="0" y1="0" x2="0.9" y2="1">
    <stop offset="0" stop-color="#e2f2e8"/>
    <stop offset="0.42" stop-color="#91b8ae"/>
    <stop offset="1" stop-color="#365f69"/>
  </linearGradient>
  <linearGradient id="shellDark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8cb8b2"/>
    <stop offset="1" stop-color="#294a58"/>
  </linearGradient>
  <linearGradient id="plate" x1="0" y1="0" x2="0.8" y2="1">
    <stop offset="0" stop-color="#f0f1d9"/>
    <stop offset="0.48" stop-color="#9dbdb0"/>
    <stop offset="1" stop-color="#456a70"/>
  </linearGradient>
  <linearGradient id="ventral" x1="0" y1="0" x2="0.8" y2="1">
    <stop offset="0" stop-color="#6b9391"/>
    <stop offset="1" stop-color="#233c4a"/>
  </linearGradient>
  <linearGradient id="limb" x1="0" y1="0" x2="0.8" y2="1">
    <stop offset="0" stop-color="#b9d3c4"/>
    <stop offset="1" stop-color="#436d72"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#e0ffff"/>
    <stop offset="0.35" stop-color="#6dfff0"/>
    <stop offset="1" stop-color="#16aeb5" stop-opacity="0.18"/>
  </radialGradient>
  <linearGradient id="sac" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffe8a0"/>
    <stop offset="0.5" stop-color="#c98954"/>
    <stop offset="1" stop-color="#6f4550"/>
  </linearGradient>
  <radialGradient id="cavity">
    <stop offset="0" stop-color="#b9d3a7"/>
    <stop offset="0.7" stop-color="#648d83"/>
    <stop offset="1" stop-color="#294b59"/>
  </radialGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#071b2b"/>
    <stop offset="1" stop-color="#163846"/>
  </linearGradient>
  <pattern id="micro" width="18" height="18" patternUnits="userSpaceOnUse">
    <path d="M2 9 L9 2 L16 9 L9 16 Z" fill="none" stroke="#d5eee0" stroke-opacity=".10" stroke-width="1"/>
  </pattern>
  <pattern id="ventralPattern" width="22" height="18" patternUnits="userSpaceOnUse">
    <path d="M0 9 L11 1 L22 9 L11 17 Z" fill="none" stroke="#c3e2d4" stroke-opacity=".24" stroke-width="1"/>
  </pattern>
</defs>
<style>
  .outline{stroke:#142f3d;stroke-width:7;stroke-linejoin:round;stroke-linecap:round}
  .seam{fill:none;stroke:#234652;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .fine{fill:none;stroke:#d5e8d9;stroke-opacity:.62;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .glint{fill:none;stroke:#69fff0;stroke-width:4;stroke-linecap:round;filter:none}
  .limbStroke{fill:none;stroke:#163744;stroke-width:26;stroke-linecap:round;stroke-linejoin:round}
  .limbCore{fill:none;stroke:url(#limb);stroke-width:18;stroke-linecap:round;stroke-linejoin:round}
  .joint{fill:#bdd6c4;stroke:#214653;stroke-width:5}
  .port{fill:#071e2a;stroke:#69bcb2;stroke-width:5}
  .eye{fill:#071d2a;stroke:#b6e6d2;stroke-width:4}
  .eyeCore{fill:#73fff0;stroke:#e2ffff;stroke-width:1.8}
  .plate{fill:url(#plate);stroke:#1a3a48;stroke-width:5;stroke-linejoin:round}
  .sac{fill:url(#sac);stroke:#472f3b;stroke-width:5}
  .antenna{fill:none;stroke:#a6cdbd;stroke-width:9;stroke-linecap:round}
  .antennaCore{fill:none;stroke:#edffed;stroke-width:2.5;stroke-linecap:round}
</style>
<rect width="512" height="512" fill="url(#bg)"/>

<!-- six limbs, three pairs; longitudinal stations are staggered in projection -->
<g>
      <path d="M170 292 L99 300 L56 319" class="limbStroke"/>
      <path d="M170 292 L99 300 L56 319" class="limbCore"/>
      <circle cx="170" cy="292" r="11" class="joint"/><circle cx="99" cy="300" r="10" class="joint"/>
      <path d="M44 313 Q56 302 68 316 Q63 329 48 326 Z" fill="#6e9994" stroke="#163744" stroke-width="4"/>
    </g><g>
      <path d="M342 292 L413 300 L456 319" class="limbStroke"/>
      <path d="M342 292 L413 300 L456 319" class="limbCore"/>
      <circle cx="342" cy="292" r="11" class="joint"/><circle cx="413" cy="300" r="10" class="joint"/>
      <path d="M444 313 Q456 302 468 316 Q463 329 448 326 Z" fill="#6e9994" stroke="#163744" stroke-width="4"/>
    </g><g>
      <path d="M170 337 L114 345 L56 364" class="limbStroke"/>
      <path d="M170 337 L114 345 L56 364" class="limbCore"/>
      <circle cx="170" cy="337" r="11" class="joint"/><circle cx="114" cy="345" r="10" class="joint"/>
      <path d="M44 358 Q56 347 68 361 Q63 374 48 371 Z" fill="#6e9994" stroke="#163744" stroke-width="4"/>
    </g><g>
      <path d="M342 337 L398 345 L456 364" class="limbStroke"/>
      <path d="M342 337 L398 345 L456 364" class="limbCore"/>
      <circle cx="342" cy="337" r="11" class="joint"/><circle cx="398" cy="345" r="10" class="joint"/>
      <path d="M444 358 Q456 347 468 361 Q463 374 448 371 Z" fill="#6e9994" stroke="#163744" stroke-width="4"/>
    </g><g>
      <path d="M170 382 L114 390 L56 409" class="limbStroke"/>
      <path d="M170 382 L114 390 L56 409" class="limbCore"/>
      <circle cx="170" cy="382" r="11" class="joint"/><circle cx="114" cy="390" r="10" class="joint"/>
      <path d="M44 403 Q56 392 68 406 Q63 419 48 416 Z" fill="#6e9994" stroke="#163744" stroke-width="4"/>
    </g><g>
      <path d="M342 382 L398 390 L456 409" class="limbStroke"/>
      <path d="M342 382 L398 390 L456 409" class="limbCore"/>
      <circle cx="342" cy="382" r="11" class="joint"/><circle cx="398" cy="390" r="10" class="joint"/>
      <path d="M444 403 Q456 392 468 406 Q463 419 448 416 Z" fill="#6e9994" stroke="#163744" stroke-width="4"/>
    </g>
<path d="M256 144 C190 144 153 178 148 232 C143 291 169 340 256 363 C343 340 369 291 364 232 C359 178 322 144 256 144 Z" fill="url(#shell)" class="outline"/>
<path d="M256 160 C207 162 178 191 176 232 C174 280 198 314 256 334 C314 314 338 280 336 232 C334 191 305 162 256 160 Z" fill="url(#micro)" opacity=".45"/>
<!-- four forward-facing eyes -->
<ellipse cx="218" cy="216" rx="17" ry="15" class="eye"/><ellipse cx="218" cy="216" rx="6" ry="6" class="eyeCore"/>
<ellipse cx="294" cy="216" rx="17" ry="15" class="eye"/><ellipse cx="294" cy="216" rx="6" ry="6" class="eyeCore"/>
<ellipse cx="218" cy="263" rx="17" ry="15" class="eye"/><ellipse cx="218" cy="263" rx="6" ry="6" class="eyeCore"/>
<ellipse cx="294" cy="263" rx="17" ry="15" class="eye"/><ellipse cx="294" cy="263" rx="6" ry="6" class="eyeCore"/>
<!-- two antennae -->
<path d="M231 159 Q218 113 205 86" class="antenna"/><path d="M231 159 Q218 113 205 86" class="antennaCore"/>
<path d="M281 159 Q294 113 307 86" class="antenna"/><path d="M281 159 Q294 113 307 86" class="antennaCore"/>
<circle cx="205" cy="86" r="6" fill="url(#glow)"/><circle cx="307" cy="86" r="6" fill="url(#glow)"/>
<!-- two feeding openings -->
<ellipse cx="210" cy="310" rx="16" ry="8" class="port"/><ellipse cx="302" cy="310" rx="16" ry="8" class="port"/>
<!-- frontmost dorsal plate; remaining five overlap behind it in this projection -->
<path d="M223 150 Q256 132 289 150 L283 171 Q256 181 229 171 Z" class="plate"/>
<path d="M236 152 Q256 145 276 152" class="glint"/>

</svg>
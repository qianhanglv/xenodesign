      <path d="M431 362 Q444 353 457 365 Q452 377 435 375 Z" fill="#6e9994" stroke="#163744" stroke-width="4"/>
      <path d="M440 367 L451 368" class="glint"/>
    </g>
<!-- outer mineralized exoskeletal rim, with a dorsal cutaway window -->
<path d="M256 62 C215 63 183 94 177 137 C164 159 151 198 153 257 C154 336 180 405 256 451 C332 405 358 336 359 257 C361 198 348 159 335 137 C329 94 297 63 256 62 Z" fill="url(#shellDark)" class="outline"/>
<path d="M256 82 C222 88 194 119 190 158 C178 223 183 319 210 379 C224 408 241 426 256 433 C271 426 288 408 302 379 C329 319 334 223 322 158 C318 119 290 88 256 82 Z" fill="#102f3b" stroke="#d4e8d5" stroke-width="4"/>
<!-- inner silicate lattice and six plate attachment rails -->
<path d="M185 160 Q256 119 327 160 M176 215 Q256 178 336 215 M175 270 Q256 238 337 270 M184 326 Q256 299 328 326 M204 378 Q256 359 308 378" fill="none" stroke="#9dc8b7" stroke-width="7" stroke-opacity=".78"/>
<path d="M216 187 L296 187 M209 227 L303 227 M205 267 L307 267 M209 307 L303 307 M217 347 L295 347 M231 387 L281 387" stroke="#d4ece0" stroke-width="3" stroke-opacity=".6"/>
<!-- two antennae and four eye sockets, retained at the head -->
<path d="M232 82 Q215 51 203 28 M280 82 Q297 51 309 28" class="antenna"/>
<circle cx="222" cy="110" r="10" class="eye"/><circle cx="290" cy="110" r="10" class="eye"/><circle cx="211" cy="139" r="10" class="eye"/><circle cx="301" cy="139" r="10" class="eye"/>
<!-- exactly two filter openings; each is connected by a mineral-lined duct -->
<ellipse cx="190" cy="168" rx="12" ry="7" class="port"/><ellipse cx="322" cy="168" rx="12" ry="7" class="port"/>
<path d="M190 176 C185 204 201 220 224 239 C234 247 239 257 244 269" fill="none" stroke="#e1b67b" stroke-width="12" stroke-linecap="round"/>
<path d="M322 176 C327 204 311 220 288 239 C278 247 273 257 268 269" fill="none" stroke="#e1b67b" stroke-width="12" stroke-linecap="round"/>
<path d="M190 176 C185 204 201 220 224 239 C234 247 239 257 244 269 M322 176 C327 204 311 220 288 239 C278 247 273 257 268 269" fill="none" stroke="#fff0c9" stroke-width="2.5" stroke-linecap="round"/>
<!-- shared digestive cavity -->
<ellipse cx="256" cy="279" rx="54" ry="38" fill="url(#cavity)" stroke="#d8e9d6" stroke-width="5"/>
<path d="M225 278 Q256 251 287 278 Q256 305 225 278 Z" fill="#254b56" stroke="#9ecfbd" stroke-width="3"/>
<!-- two separate posterior spore sacs in paired cradles -->
<path d="M230 311 Q208 332 207 355 M282 311 Q304 332 305 355" fill="none" stroke="#dcb27b" stroke-width="7"/>
<ellipse cx="211" cy="363" rx="31" ry="25" class="sac"/><ellipse cx="301" cy="363" rx="31" ry="25" class="sac"/>
<path d="M190 359 Q211 342 232 359 M280 359 Q301 342 322 359" class="fine"/>
<!-- paired sac outlets to ventral surface -->
<ellipse cx="211" cy="399" rx="10" ry="6" class="port"/><ellipse cx="301" cy="399" rx="10" ry="6" class="port"/>
<!-- cut edge exposes layered silica-ceramic shell and chitin-free mineral ribs -->
<path d="M178 137 Q160 255 181 365" fill="none" stroke="#e7f1dd" stroke-width="9" stroke-linecap="round"/>
<path d="M334 137 Q352 255 331 365" fill="none" stroke="#e7f1dd" stroke-width="9" stroke-linecap="round"/>

</svg>
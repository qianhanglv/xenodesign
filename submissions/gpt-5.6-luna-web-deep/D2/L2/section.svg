      <path d="M175 286 L111 272 L68 293" class="limbStroke"/>
      <path d="M175 286 L111 272 L68 293" class="limbCore"/>
      <circle cx="175" cy="286" r="11" class="joint"/><circle cx="111" cy="272" r="10" class="joint"/>
      <path d="M55 288 Q68 279 81 291 Q76 303 59 301 Z" fill="#6e9994" stroke="#163744" stroke-width="4"/>
      <path d="M64 293 L75 294" class="glint"/>
    </g><g>
      <path d="M337 286 L401 272 L444 293" class="limbStroke"/>
      <path d="M337 286 L401 272 L444 293" class="limbCore"/>
      <circle cx="337" cy="286" r="11" class="joint"/><circle cx="401" cy="272" r="10" class="joint"/>
      <path d="M431 288 Q444 279 457 291 Q452 303 435 301 Z" fill="#6e9994" stroke="#163744" stroke-width="4"/>
      <path d="M440 293 L451 294" class="glint"/>
    </g><g>
      <path d="M175 360 L111 346 L68 367" class="limbStroke"/>
      <path d="M175 360 L111 346 L68 367" class="limbCore"/>
      <circle cx="175" cy="360" r="11" class="joint"/><circle cx="111" cy="346" r="10" class="joint"/>
      <path d="M55 362 Q68 353 81 365 Q76 377 59 375 Z" fill="#6e9994" stroke="#163744" stroke-width="4"/>
      <path d="M64 367 L75 368" class="glint"/>
    </g><g>
      <path d="M337 360 L401 346 L444 367" class="limbStroke"/>
      <path d="M337 360 L401 346 L444 367" class="limbCore"/>

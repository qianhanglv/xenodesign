  <circle cx="188" cy="204" r="5" fill="#fef08a" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="144" cy="300" r="5.5" fill="#fef08a" stroke="#f59e0b" stroke-width="2"/>

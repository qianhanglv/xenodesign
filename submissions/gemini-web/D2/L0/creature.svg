<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgVent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="silicatePlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="photophore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sporeSac" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.7"/>
    </radialGradient>
  </defs>

  <!-- Abyssal Hydrothermal Vent Context (F1) -->
  <rect width="512" height="512" fill="url(#bgVent)"/>
  <path d="M 360,420 L 385,290 L 415,285 L 435,310 L 455,420 Z" fill="#1c1917" stroke="#44403c" stroke-width="2"/>
  <path d="M 390,285 Q 375,210 405,140 Q 430,80 395,20 Q 445,70 435,150 Q 455,220 415,285 Z" fill="#334155" fill-opacity="0.35"/>
  <ellipse cx="400" cy="288" rx="14" ry="4" fill="#ea580c" fill-opacity="0.7"/>

  <!-- Scale Bar: 1-3 m ticks (140px = 1m, 280px = 2m, 420px = 3m; creature = 280px = 2m) (P1) -->
  <g stroke="#64748b" stroke-width="2">
    <line x1="116" y1="455" x2="396" y2="455"/>
    <line x1="116" y1="447" x2="116" y2="463"/>
    <line x1="256" y1="447" x2="256" y2="463"/>
    <line x1="396" y1="447" x2="396" y2="463"/>
  </g>

  <!-- Far Limbs (Left Side: 3 of 6 limbs) (Q1) -->
  <g stroke="#1e293b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="175,285 160,330 145,375"/>
    <polyline points="245,288 240,335 232,378"/>
    <polyline points="315,285 325,330 335,375"/>
  </g>

  <!-- Ventral Articulated Chassis & Tuck Grooves (F4, N1) -->
  <path d="M 122,272 Q 256,296 392,272 L 385,255 L 128,255 Z" fill="#0f172a" stroke="#475569" stroke-width="2"/>

  <!-- 2 Feeding Openings with Filter Combs (Q3, F2) -->
  <g>
    <!-- Far Siphon -->
    <ellipse cx="126" cy="264" rx="10" ry="6" fill="#020617" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 118,262 L 104,256 M 117,265 L 102,265 M 118,268 L 105,273" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Near Siphon -->
    <ellipse cx="136" cy="272" rx="12" ry="7" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 126,269 L 108,262 M 125,272 L 106,272 M 126,275 L 109,281" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 6 Dorsal Overlapping Silicate Plates (Q5, N1, P2, F4) -->
  <g stroke="#94a3b8" stroke-width="2" stroke-linejoin="round">
    <!-- Plate 1 (Cephalic shield) -->
    <path d="M 116,262 C 116,222 145,205 172,202 L 166,264 Z" fill="url(#silicatePlate)"/>
    <!-- Plate 2 -->
    <path d="M 164,202 C 185,196 205,194 218,194 L 212,266 L 160,264 Z" fill="url(#silicatePlate)"/>
    <!-- Plate 3 -->
    <path d="M 210,194 C 232,191 252,191 266,192 L 260,268 L 206,266 Z" fill="url(#silicatePlate)"/>
    <!-- Plate 4 -->
    <path d="M 258,192 C 280,193 300,195 314,198 L 308,267 L 254,268 Z" fill="url(#silicatePlate)"/>
    <!-- Plate 5 -->
    <path d="M 306,198 C 328,202 346,208 360,215 L 352,265 L 302,267 Z" fill="url(#silicatePlate)"/>
    <!-- Plate 6 (Pygidial tail plate) -->
    <path d="M 352,215 C 378,226 396,244 396,264 L 346,265 Z" fill="url(#silicatePlate)"/>
  </g>

  <!-- Crystalline Silicon Facets (P2) -->
  <g stroke="#cbd5e1" stroke-width="1" stroke-opacity="0.5" fill="none">
    <polyline points="135,235 152,218 164,240"/>
    <polyline points="180,225 198,208 210,235"/>
    <polyline points="228,222 246,205 258,235"/>
    <polyline points="276,224 294,207 306,236"/>
    <polyline points="322,230 340,216 350,242"/>
  </g>

  <!-- 2 Paired Spore Sacs nestled in dorsal-lateral recesses (Q4, F2) -->
  <g>
    <!-- Anterior Spore Sac -->
    <ellipse cx="212" cy="222" rx="18" ry="12" fill="url(#sporeSac)" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="208" cy="220" r="2.5" fill="#cffafe"/>
    <circle cx="216" cy="224" r="2" fill="#cffafe"/>
    <!-- Posterior Spore Sac -->
    <ellipse cx="308" cy="224" rx="18" ry="12" fill="url(#sporeSac)" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="304" cy="222" r="2.5" fill="#cffafe"/>
    <circle cx="312" cy="226" r="2" fill="#cffafe"/>
  </g>

  <!-- Bioluminescent Light Communication Strips along Plates (F3) -->
  <g fill="#fde047">
    <rect x="132" y="250" width="16" height="4" rx="2"/>
    <rect x="178" y="252" width="20" height="4" rx="2"/>
    <rect x="226" y="253" width="20" height="4" rx="2"/>
    <rect x="274" y="253" width="20" height="4" rx="2"/>
    <rect x="320" y="251" width="18" height="4" rx="2"/>
    <rect x="362" y="250" width="14" height="4" rx="2"/>
  </g>
  <circle cx="236" cy="255" r="16" fill="url(#photophore)"/>
  <circle cx="284" cy="255" r="16" fill="url(#photophore)"/>

  <!-- 4 Eyes total (2 visible on near right side, 2 symmetric on far left side) (Q2) -->
  <g>
    <!-- Near Anterior Eye -->
    <circle cx="144" cy="236" r="6" fill="#fef08a" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="143" cy="236" r="2.5" fill="#0f172a"/>
    <!-- Near Mid-Lateral Eye -->
    <circle cx="188" cy="238" r="5.5" fill="#fef08a" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="187" cy="238" r="2.2" fill="#0f172a"/>
  </g>

  <!-- Near Limbs (Right Side: 3 of 6 limbs, jointed to fold into ventral grooves) (Q1, F4, N1) -->
  <g stroke="#475569" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Near Front Limb -->
    <polyline points="182,282 168,332 154,382"/>
    <path d="M 154,382 L 145,388 M 154,382 L 161,389" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Near Mid Limb -->
    <polyline points="256,286 250,336 244,384"/>
    <path d="M 244,384 L 235,390 M 244,384 L 251,390" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Near Rear Limb -->
    <polyline points="328,282 338,332 348,382"/>
    <path d="M 348,382 L 339,389 M 348,382 L 356,388" stroke="#cbd5e1" stroke-width="3"/>
  </g>

  <!-- 2 Segmented Silicate Antennae (Q6) -->
  <g fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round">
    <path d="M 122,242 Q 82,215 48,185"/>
    <path d="M 126,236 Q 94,198 68,162" stroke="#0284c7" stroke-width="2.5"/>
  </g>
  <g fill="#bae6fd">
    <circle cx="85" cy="216" r="2.5"/><circle cx="65" cy="200" r="2.5"/><circle cx="48" cy="185" r="3"/>
    <circle cx="96" cy="200" r="2"/><circle cx="81" cy="180" r="2"/><circle cx="68" cy="162" r="2.5"/>
  </g>
</svg>
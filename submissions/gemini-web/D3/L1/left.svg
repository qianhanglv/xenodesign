<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#021510"/>
  <!-- Lateral left view preserving 8 segments, 3 sections, 6 limbs, 4 eyes, 3 feeding openings, 4 gills, 6 light organs, 4 pits -->
  <g transform="translate(256, 256)">
    <!-- 8 Body segments profile (Q7, N1, Q8) -->
    <path d="M 0,-110 C 60,-110 80,-70 80,-30 C 80,20 60,70 0,95 C -60,70 -80,20 -80,-30 C -80,-70 -60,-110 0,-110 Z" fill="#059669" stroke="#34d399" stroke-width="2.5"/>
    <ellipse cx="0" cy="-30" rx="65" ry="75" fill="#10b981" stroke="#6ee7b7" stroke-width="2"/>

    <!-- 3 Feeding openings anteriorly (Q3) -->
    <ellipse cx="-75" cy="-30" rx="6" ry="12" fill="#022c22" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="-70" cy="-60" r="7" fill="#022c22" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="-70" cy="0" r="7" fill="#022c22" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- 4 Eyes (Q2) -->
    <circle cx="-50" cy="-75" r="6" fill="#fef08a" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="-50" cy="15" r="6" fill="#fef08a" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="-30" cy="-85" r="5" fill="#fef08a" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="-30" cy="25" r="5" fill="#fef08a" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- 6 Light Organs (Q5) -->
    <circle cx="-60" cy="-45" r="6" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
    <circle cx="-20" cy="-70" r="6" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
    <circle cx="20" cy="-55" r="6" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
    <circle cx="-20" cy="10" r="6" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
    <circle cx="20" cy="30" r="6" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
    <circle cx="50" cy="-10" r="6" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>

    <!-- 4 Sensory Pits (Q6) -->
    <circle cx="-68" cy="-90" r="3" fill="#022c22" stroke="#6ee7b7" stroke-width="1.5"/>
    <circle cx="-68" cy="30" r="3" fill="#022c22" stroke="#6ee7b7" stroke-width="1.5"/>
    <circle cx="10" cy="-90" r="3" fill="#022c22" stroke="#6ee7b7" stroke-width="1.5"/>
    <circle cx="10" cy="50" r="3" fill="#022c22" stroke="#6ee7b7" stroke-width="1.5"/>

    <!-- 4 Gill Openings (Q4) -->
    <line x1="20" y1="-40" x2="35" y2="-40" stroke="#022c22" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="-20" x2="35" y2="-20" stroke="#022c22" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="0" x2="35" y2="0" stroke="#022c22" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="20" x2="35" y2="20" stroke="#022c22" stroke-width="3" stroke-linecap="round"/>

    <!-- 6 Limbs (3 visible on left side in lateral profile) (Q1) -->
    <g fill="none" stroke="#047857" stroke-width="7" stroke-linecap="round">
      <path d="M -40,-60 Q -90,-40 -130,-10"/>
      <path d="M -20,0 Q -80,30 -120,60"/>
      <path d="M 0,50 Q -60,90 -100,120"/>
    </g>
  </g>
</svg>
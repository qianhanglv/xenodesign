<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#021510"/>
  <!-- Bottom view featuring 3 Feeding Openings (Q3) and 4 Gills (Q4) and 6 Limbs (Q1) -->
  <g transform="translate(256, 256)">
    <circle cx="0" cy="0" r="95" fill="#047857" stroke="#34d399" stroke-width="3"/>
    <circle cx="0" cy="0" r="70" fill="#059669" stroke="#6ee7b7" stroke-width="2"/>

    <!-- 3 Feeding Openings (Q3) -->
    <circle cx="0" cy="-20" r="12" fill="#022c22" stroke="#34d399" stroke-width="2.5"/>
    <circle cx="-16" cy="10" r="10" fill="#022c22" stroke="#34d399" stroke-width="2"/>
    <circle cx="16" cy="10" r="10" fill="#022c22" stroke="#34d399" stroke-width="2"/>

    <!-- 4 Gill Openings (Q4) -->
    <line x1="-50" y1="-50" x2="-70" y2="-50" stroke="#022c22" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="50" y1="-50" x2="70" y2="-50" stroke="#022c22" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-50" y1="50" x2="-70" y2="50" stroke="#022c22" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="70" y2="50" stroke="#022c22" stroke-width="3.5" stroke-linecap="round"/>

    <!-- 6 Limbs radiating radially (Q1) -->
    <g fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round">
      <line x1="0" y1="-95" x2="0" y2="-155"/>
      <line x1="-82" y1="-48" x2="-135" y2="-75"/>
      <line x1="82" y1="-48" x2="135" y2="-75"/>
      <line x1="-82" y1="48" x2="-135" y2="75"/>
      <line x1="82" y1="48" x2="135" y2="75"/>
      <line x1="0" y1="95" x2="0" y2="155"/>
    </g>
  </g>
</svg>
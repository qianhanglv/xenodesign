<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#021510"/>
  <!-- Top radial view showing 6 limbs, 4 eyes, 6 light organs, 4 pits, 8 segments -->
  <g transform="translate(256, 256)">
    <circle cx="0" cy="0" r="100" fill="#10b981" stroke="#34d399" stroke-width="3"/>
    <circle cx="0" cy="0" r="75" fill="#059669" stroke="#6ee7b7" stroke-width="2"/>
    <circle cx="0" cy="0" r="45" fill="#047857" stroke="#34d399" stroke-width="2"/>

    <!-- 4 Eyes (Q2) -->
    <circle cx="-45" cy="-45" r="7" fill="#fef08a" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="45" cy="-45" r="7" fill="#fef08a" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="-45" cy="45" r="6" fill="#fef08a" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="45" cy="45" r="6" fill="#fef08a" stroke="#f59e0b" stroke-width="2"/>

    <!-- 6 Light Organs (Q5) -->
    <circle cx="0" cy="-65" r="7" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
    <circle cx="-55" cy="-20" r="7" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
    <circle cx="55" cy="-20" r="7" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
    <circle cx="-35" cy="55" r="7" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
    <circle cx="35" cy="55" r="7" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
    <circle cx="0" cy="80" r="7" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>

    <!-- 4 Sensory Pits (Q6) -->
    <circle cx="0" cy="-85" r="3.5" fill="#022c22" stroke="#6ee7b7" stroke-width="1.5"/>
    <circle cx="-80" cy="0" r="3.5" fill="#022c22" stroke="#6ee7b7" stroke-width="1.5"/>
    <circle cx="80" cy="0" r="3.5" fill="#022c22" stroke="#6ee7b7" stroke-width="1.5"/>
    <circle cx="0" cy="90" r="3.5" fill="#022c22" stroke="#6ee7b7" stroke-width="1.5"/>

    <!-- 6 Limbs radiating radially (Q1) -->
    <g fill="none" stroke="#047857" stroke-width="8" stroke-linecap="round">
      <line x1="0" y1="-100" x2="0" y2="-160"/>
      <line x1="-86" y1="-50" x2="-140" y2="-80"/>
      <line x1="86" y1="-50" x2="140" y2="-80"/>
      <line x1="-86" y1="50" x2="-140" y2="80"/>
      <line x1="86" y1="50" x2="140" y2="80"/>
      <line x1="0" y1="100" x2="0" y2="160"/>
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Antennae tips peeking above -->
  <path d="M 244,225 Q 210,175 190,140" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 268,225 Q 302,175 322,140" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Dorsal Water Sac -->
  <path d="M 206,225 C 206,155 306,155 306,225 Z" fill="#0088cc" fill-opacity="0.65" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Limbs (4 total: rear pair foreground, front pair slightly inward) -->

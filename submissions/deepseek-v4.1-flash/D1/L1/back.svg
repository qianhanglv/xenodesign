    </g>
    <clipPath id="bodyClipTop"><path d="M 108 256 C 108 238 118 225 134 219 C 156 210 178 202 204 199 C 236 188 300 188 336 203 C 362 214 386 230 394 250 C 400 264 400 282 392 296 C 376 318 348 328 316 331 C 280 337 228 335 194 327 C 160 319 130 306 116 290 C 108 280 106 268 108 256 Z"/></clipPath>
    <clipPath id="sacClipF"><ellipse cx="256" cy="222" rx="49" ry="31"/></clipPath>
    <clipPath id="sacClipTop"><ellipse cx="326" cy="252" rx="49" ry="35"/></clipPath>

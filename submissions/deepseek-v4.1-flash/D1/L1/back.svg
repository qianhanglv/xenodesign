<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="72%">
      <stop offset="0" stop-color="#102d3d"/>
      <stop offset="0.6" stop-color="#071722"/>
      <stop offset="1" stop-color="#02080d"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7ebe7"/>
      <stop offset="0.34" stop-color="#6cb6c2"/>
      <stop offset="0.7" stop-color="#3a8099"/>
      <stop offset="1" stop-color="#154a64"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f7ef"/>
      <stop offset="0.5" stop-color="#a8d3cf"/>
      <stop offset="1" stop-color="#77a8b2"/>
    </linearGradient>
    <linearGradient id="limb" x1="0" y1="0" x2="0" y2="1">
